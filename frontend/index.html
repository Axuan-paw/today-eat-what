<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天吃什么</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --accent2: #ef4444;
    --ok: #22c55e;
  }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .stage {
    background: linear-gradient(160deg, var(--card) 0%, #16223a 100%);
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 36px 20px 28px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .stage::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 120%, rgba(245,158,11,.18), transparent 60%);
    pointer-events: none;
  }
  .dish { font-size: 34px; font-weight: 800; letter-spacing: 2px; min-height: 46px; transition: opacity .18s; }
  .dish.rolling { opacity: .35; }
  .tags { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 24px; }
  .tag { background: var(--card2); color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .pick {
    margin-top: 22px;
    border: 0; border-radius: 999px;
    padding: 14px 44px;
    font-size: 17px; font-weight: 700; letter-spacing: 3px;
    color: #1a1205;
    background: linear-gradient(135deg, var(--accent), #fbbf24);
    cursor: pointer;
    transition: transform .12s, box-shadow .2s;
    box-shadow: 0 6px 18px rgba(245,158,11,.28);
  }
  .pick:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(245,158,11,.38); }
  .pick:active { transform: translateY(0); }
  .pick:disabled { opacity: .6; cursor: default; transform: none; }
  .panel { background: var(--card); border: 1px solid #334155; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"], input[type="number"] {
    flex: 1; min-width: 90px;
    background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--ok); color: #052e16;
  }
  .btn.ghost { background: var(--card2); color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card2); border-radius: 10px; padding: 9px 12px; font-size: 14px;
  }
  .row .name { flex: 1; }
  .row .price { color: var(--muted); font-size: 12px; }
  .row .del {
    border: 0; background: transparent; color: #64748b;
    cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1;
  }
  .row .del:hover { color: var(--accent2); }
  .empty { color: #64748b; font-size: 13px; text-align: center; padding: 12px; }
  .hist { display: flex; gap: 6px; flex-wrap: wrap; }
  .hist span { background: var(--card2); color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 8px; }
  .foot { text-align: center; color: #475569; font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>今天吃什么</h1>
  <div class="sub">选不出来？让偏好推荐引擎帮你决定</div>

  <div class="stage">
    <div class="dish" id="dish">点一下开始</div>
    <div class="tags" id="curTags"></div>
    <button class="pick" id="pickBtn">随机抽</button>
    <button class="pick" id="recommendBtn" style="background: linear-gradient(135deg, #22c55e, #4ade80); color: #052e16; margin-left: 10px;">智能推荐</button>
    <div id="reason" style="color: #94a3b8; font-size: 13px; margin-top: 10px; min-height: 18px;"></div>
  </div>

<!-- 我的偏好面板 -->
<div class="panel">
  <h2>我的偏好</h2>

  <!-- 第一行：家乡和菜系(V3版本 生效） -->
  <div class="add-row" style="margin-bottom: 8px;">
    <select id="profileHometown" style="flex:1; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:10px; padding:10px;">
      <option value="">-- 请选择 --</option>
      <option value="四川">四川</option>
      <option value="湖南">湖南</option>
      <option value="上海">上海</option>
      <option value="广东">广东</option>
      <option value="北京">北京</option>
      <option value="其他">其他</option>
    </select>

    <select id="profileCuisine" style="flex:1; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:10px; padding:10px;">
      <option value="">-- 请选择 --</option>
      <option value="不限">不限</option>
      <option value="川湘">川湘</option>
      <option value="江浙">江浙</option>
      <option value="粤式">粤式</option>
      <option value="北方">北方</option>
      <option value="西北">西北</option>
      <option value="日韩">日韩</option>
      <option value="西式">西式</option>
    </select>
  </div>

  <!-- 第二行：目标和心情 -->
  <div class="add-row" style="margin-bottom: 8px;">
    <select id="profileGoal" style="flex:1; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:10px; padding:10px;">
      <option value="">-- 请选择健康目标 --</option>  <!-- 占位项，空值 -->
      <option value="均衡">均衡</option>
      <option value="减脂">减脂</option>
      <option value="增肌">增肌</option>
      <option value="控糖">控糖</option>
    </select>

    <select id="profileMood" style="flex:1; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:10px; padding:10px;">
      <option value="">-- 请选择心情 --</option>
      <option value="平静">平静</option>
      <option value="开心">开心</option>
      <option value="疲惫">疲惫</option>
      <option value="低落">低落</option>
      <option value="想解压">想解压</option>
      <option value="没胃口">没胃口</option>
      <option value="想犒劳自己">想犒劳自己</option>
      <option value="其他">其他</option>
    </select>
  </div>

  <!--第三行： 口味多选 -->
<div class="add-row" style="margin-bottom: 8px; align-items: center;">
  <span style="color:#94a3b8; font-size:13px; margin-right:4px;">口味：</span>
  <label style="color:#e2e8f0; font-size:13px; margin-right:10px;">
    <input type="checkbox" class="tasteBox" value="辣" /> 辣
  </label>
  <label style="color:#e2e8f0; font-size:13px; margin-right:10px;">
    <input type="checkbox" class="tasteBox" value="清淡" /> 清淡
  </label>
  <label style="color:#e2e8f0; font-size:13px; margin-right:10px;">
    <input type="checkbox" class="tasteBox" value="重口" /> 重口
  </label>
  <label style="color:#e2e8f0; font-size:13px; margin-right:10px;">
    <input type="checkbox" class="tasteBox" value="酸甜" /> 酸甜
  </label>
  <label style="color:#e2e8f0; font-size:13px;">
    <input type="checkbox" class="tasteBox" value="鲜" /> 鲜
  </label>
</div>


  <!-- 第四行：忌口和预算 -->
  <div class="add-row">
    <input type="text" id="profileAvoid" placeholder="绝对不吃，如：香菜,内脏" style="flex:2" />
    <input type="number" id="profileBudget" placeholder="预算(元)" style="max-width:100px" />
  </div>
</div>


  <div class="panel">
    <h2>候选菜单（<span id="count">0</span>）</h2>
    <div class="add-row" style="margin-bottom:12px">
      <input type="text" id="newName" placeholder="菜品名，如：麻辣烫" />
      <input type="text" id="newTags" placeholder="标签，可选" style="max-width:130px" />
      <input type="number" id="newPrice" placeholder="价格" style="max-width:90px" />
      <button class="btn" id="addBtn">添加</button>
    </div>
    <input type="text" id="filter" placeholder="搜索…" style="width:100%;margin-bottom:12px" />
    <div class="list" id="list"></div>
  </div>

  <div class="panel">
    <h2>最近抽到</h2>
    <div class="hist" id="hist"></div>
  </div>

  <div class="foot">数据存在浏览器本地（localStorage），换个浏览器就各存各的。</div>
</div>

<script>
const STORAGE_KEY_V1 = "today-eat-what:v1";
const STORAGE_KEY= "today-eat-what:v2";

const DEFAULT_DISHES = [
  { name: "麻辣烫", tags: ["川味", "汤"], price: 18 ,cuisine:"川湘",calories:550,spicy:3,heaviness:"heavy",suitableMood:["低落","想解压"],serving:"single"},
  { name: "黄焖鸡米饭", tags: ["中式", "饭"], price: 20,cuisine: "北方",calories: 600,spicy:1,heaviness:"medium",suitableMood:[],serving:"single"},
  { name: "番茄鸡蛋面", tags: ["中式", "面"], price: 15, cuisine: "北方", calories: 450, spicy: 0, heaviness: "light", suitableMood: ["没胃口"], serving: "single" },
  { name: "螺蛳粉", tags: ["粉", "重口"], price: 16, cuisine: "其他", calories: 500, spicy: 4, heaviness: "heavy", suitableMood: ["想解压"], serving: "single" },
  { name: "盖浇饭", tags: ["中式", "饭"], price: 18, cuisine: "北方", calories: 600, spicy: 1, heaviness: "medium", suitableMood: [], serving: "single" },
  { name: "兰州拉面", tags: ["面"], price: 17, cuisine: "西北", calories: 480, spicy: 0, heaviness: "medium", suitableMood: [], serving: "single" },
  { name: "汉堡套餐", tags: ["西式"], price: 25, cuisine: "西式", calories: 750, spicy: 0, heaviness: "heavy", suitableMood: ["想犒劳自己"], serving: "single" },
  { name: "寿司", tags: ["日式"], price: 28, cuisine: "日韩", calories: 350, spicy: 0, heaviness: "light", suitableMood: ["开心"], serving: "single" },
  { name: "炸鸡", tags: ["炸物"], price: 24, cuisine: "西式", calories: 800, spicy: 1, heaviness: "heavy", suitableMood: ["低落", "想解压"], serving: "share" },
  { name: "饺子", tags: ["中式"], price: 16, cuisine: "北方", calories: 450, spicy: 0, heaviness: "medium", suitableMood: [], serving: "single" },
  { name: "烤肉饭", tags: ["中式", "饭"], price: 22, cuisine: "其他", calories: 680, spicy: 2, heaviness: "heavy", suitableMood: ["想犒劳自己"], serving: "single" },
  { name: "沙拉", tags: ["轻食"], price: 21, cuisine: "西式", calories: 180, spicy: 0, heaviness: "light", suitableMood: ["没胃口"], serving: "single" },
];

// 用户画像的默认值（当用户什么都没选时，用这套兜底）
const DEFAULT_PROFILE = {
  hometown: "",          // 家乡：未选择
  currentCity: "",       // 现居地：未选择（预留）
  cuisine: "不限",       // 菜系：默认不限
  taste: [],             // 口味：空数组
  goals: ["均衡"],       // 健康目标：默认均衡
  avoidHard: [],   // 硬忌口：过敏、绝对不吃（一票否决）
  avoidSoft: [],   // 软忌口：不爱吃，但可备注去掉  // 忌口：空数组
  budget: null,          // 预算：null 代表不限
  mood: "平静",          // 心情：默认平静
  headcount: 1,          // 人数：默认 1 人（预留）
  diningCompanions: [],  // 饭搭子忌口：空数组（预留）
  portionSize: "medium", // 饭量：默认中（预留）
  age: null,             // 年龄：未设置（预留）
  gender: null           // 性别：未设置（预留）
};

let state = load();
let rolling = false;

function upgradeDish(oldDish){
  return {
    name: oldDish.name,
    tags: oldDish.tags || [],
    price: oldDish.price ?? null, // 0 元也能被正确保留
    cuisine: oldDish.cuisine || "其他",
    calories: oldDish.calories || null,
    spicy: oldDish.spicy != null ? oldDish.spicy : null,
    heaviness: oldDish.heaviness || "medium",
    suitableMood: oldDish.suitableMood || [],
    serving: oldDish.serving || "single"
  };
}


function load() {
  // 1. 优先读取当前版本 (v2)。如果读到了且有效，直接返回，不要去碰 v1！
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.version === 2 && Array.isArray(parsed.dishes) && parsed.dishes.length) {
          return normalizeState(parsed);
      }
    }
  } catch (e) {
    console.warn("读取当前版本数据失败，尝试迁移或使用默认数据", e);
  }

  // 2. 如果 v2 没有数据（比如第一次升级），再尝试从 v1 迁移
  const migrated = migrateFromV1();
  if (migrated) return migrated;

  // 3. 兜底：v1 也没有，v2 也没读到，说明是全新用户，使用默认数据
  return defaultState();
}

// 把 v1 升级成 v2；没有旧数据或迁移失败就返回 null
function migrateFromV1() {
  const oldRaw = localStorage.getItem(STORAGE_KEY_V1);
  if (!oldRaw) return null;

  console.log("发现旧版 v1 数据，开始迁移…");

  try {
    const oldData = JSON.parse(oldRaw);
    if (!Array.isArray(oldData.dishes)) return null;

    const migrated = normalizeState({
      version: 2,
      dishes: oldData.dishes.map(upgradeDish),
      history: oldData.history,
      current: null,
    });

    // 立刻写回，防止刷新丢失
    localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
    return migrated;
  } catch (e) {
    console.warn("旧数据解析失败，跳过迁移", e);
    return null;
  }
}

// 把任意对象整理成标准 v2 结构
function normalizeState(obj) {
  return {
    version: 2,
    dishes: obj.dishes ?? [],
    history: Array.isArray(obj.history) ? obj.history : [],
    current: obj.current ?? null,
    // 用 structuredClone 彻底隔离，防止污染默认模板
    profile: { ...structuredClone(DEFAULT_PROFILE), ...(obj.profile || {}) }
  };
}

// 默认状态
function defaultState() {
  return {
    version: 2,
    dishes: DEFAULT_DISHES.map(upgradeDish),
    history: [],
    current: null,
    profile: structuredClone(DEFAULT_PROFILE)
  };
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// 新增：统一管理本人和搭子的忌口
function mergeAvoid(profile) {
  return {
    hard: [
      ...(profile.avoidHard || []),
      ...(profile.diningCompanions || []).flatMap(c => c.avoid || [])
    ],
    soft: [...(profile.avoidSoft || [])]    // 软忌口先留着，等下打分要用
  };
}

function scoreDish(dish, profile, avoid) {
  // 1. 初始化基础数据
  let score = 0;
  let hits = [];
  let rejected = false;

  // 2. 硬忌口命中：一票否决（直接返回，不参与后续打分）
  const hay = dish.name + " " + (dish.tags || []).join(" ");
  if (avoid.hard.some(w => hay.includes(w))) {
    return { score: -Infinity, hits: [], rejected: true };
  }

  // 3. 规则一：菜系匹配（+20分）
  if (profile.cuisine && profile.cuisine !== "不限" && dish.cuisine === profile.cuisine) {
    score += 20;
    hits.push("符合你偏好的" + dish.cuisine + "口味");
  }

  // 4. 规则二：减脂目标（+25分，注意 null 比较陷阱！）
  if (profile.goals && profile.goals.includes("减脂") && dish.calories != null && dish.calories <= 400) {
    score += 25;
    hits.push("热量较低，适合减脂");
  }

  // 5. 规则三：心情匹配（+15分，注意 taste 为空时不能报错）
  if (profile.mood && dish.suitableMood && dish.suitableMood.includes(profile.mood)) {
    score += 15;
    hits.push("适合你现在" + profile.mood + "的状态");
  }

  // 规则四：口味匹配（+15分，权重稍低，因为口味比较主观）
  // 注意：profile.taste 可能是空数组，必须判空，否则 .includes 会报错
  if (profile.taste && profile.taste.length > 0) {
    // 1. 喜欢“辣”，且辣度 >= 3
    if (profile.taste.includes("辣") && dish.spicy != null && dish.spicy >= 3) {
      score += 15;
      hits.push("辣度符合你的口味");
    }
    // 2. 喜欢“清淡”，且辣度 <= 1
    else if (profile.taste.includes("清淡") && dish.spicy != null && dish.spicy <= 1) {
      score += 15;
      hits.push("清淡口味，符合你的偏好");
    }
    // 3. 喜欢“重口”，且 heaviness 是 heavy
    if (profile.taste.includes("重口") && dish.heaviness === "heavy") {
      score += 15;
      hits.push("重口菜肴，正合你意");
    }
  }

  // 规则五：增肌目标（+20分）
  if (profile.goals && profile.goals.includes("增肌") && dish.calories != null && dish.calories >= 600) {
    score += 20;
    hits.push("热量充足，适合增肌");
  }

  // 规则六：控糖目标（+15分，以“清淡少油”作为简易替代指标）
  if (profile.goals && profile.goals.includes("控糖") && dish.heaviness === "light") {
    score += 15;
    hits.push("清淡少油，适合控糖");
  }

  // 规则七：价格实惠（+15分，预算的80%以内）
  if (profile.budget != null && dish.price != null && dish.price <= profile.budget * 0.8) {
    score += 15;
    hits.push("价格实惠");
  }

  // 规则八：软忌口提示（不剔除、不扣分，只加温馨提示）
  const softHay = dish.name + " " + (dish.tags || []).join(" ");
  const softHit = avoid.soft.find(w => softHay.includes(w));
  if (softHit) {
    hits.push("温馨提示：菜品含" + softHit + "，点单时可备注去掉");
  }

  // 6. 返回结果
  return { score: score, hits: hits, rejected: false };
}

// 拼接给用户看的推荐理由
function buildReason(hits, strategy) {
  if (strategy === "explore") return "换换口味：你有段时间没吃这个了";
  if (!hits || !hits.length) return "随机为你挑选，试试新口味";
  return hits.slice(0, 3).join("；"); // 最多取前3条理由拼接
}

// 推荐引擎主函数
async function recommend(profile, dishes, opts = {}) {
  const avoid = mergeAvoid(profile);
  const history = opts.history || state.history || [];
  const exploreRate = opts.exploreRate ?? 0.15;

  // 1. 过滤（带预算放宽机制）
  let pool = filterDishes(dishes, profile);
  if (!pool.length) pool = filterDishes(dishes, { ...profile, budget: null });
  if (!pool.length) return { dish: null, reason: "菜单是空的，先添加几道菜", source: "none", strategy: "fallback" };

  // 2. 打分
  const scored = pool.map(d => ({ dish: d, ...scoreDish(d, profile, avoid) }));

  // 3. 探索分支（掷骰子）
  const isExplore = Math.random() < exploreRate;
  let strategy = "exploit";
  let chosen;

  if (isExplore) {
    // 从候选池里剔除吃过的菜
    const fresh = pool.filter(d => !history.includes(d.name));
    if (fresh.length) {
      // 从没吃过的里面，挑分数最高的（避免纯随机推出离谱的菜）
      const freshScored = scored.filter(s => fresh.some(f => f.name === s.dish.name));
      const freshBest = Math.max(...freshScored.map(s => s.score));
      const freshTop = freshScored.filter(s => s.score === freshBest);
      chosen = freshTop[Math.floor(Math.random() * freshTop.length)];
      strategy = "explore";
    }
  }

  // 4. 如果没探索，或者探索失败（都吃过了），走利用分支
  if (!chosen) {
    const bestScore = Math.max(...scored.map(s => s.score));
    const topScored = scored.filter(s => s.score === bestScore);
    chosen = topScored[Math.floor(Math.random() * topScored.length)];
  }

  // 5. 返回结果
  return {
    dish: chosen.dish,
    reason: buildReason(chosen.hits, strategy),
    source: "rule",
    strategy: strategy,
    debug: { score: chosen.score, hits: chosen.hits }
  };
}

// 统一的过滤规则：pick() 和未来的 recommend() 共用
function filterDishes(dishes, profile) {
  const { hard } = mergeAvoid(profile);
  return dishes.filter(function (d) {
    // 1. 硬忌口：菜名或标签命中任一词，直接剔除
    const hay = d.name + " " + (d.tags || []).join(" ");
    if (hard.some(w => hay.includes(w))) return false;
    // 2. 菜系：选了具体菜系才过滤
    if (profile.cuisine && profile.cuisine !== "不限" && d.cuisine !== profile.cuisine) return false;
    // 3. 预算：超预算剔除（注意 null 判断）
    if (profile.budget != null && d.price != null && d.price > profile.budget) return false;
    return true;
  });
}

// 公共的滚动动画函数
function playRollAnimation(pool, finalDish, onDone) {
  const dishEl = document.getElementById("dish");
  const pickBtn = document.getElementById("pickBtn");
  const recBtn = document.getElementById("recommendBtn");

  dishEl.classList.add("rolling");
  pickBtn.disabled = true;
  recBtn.disabled = true;

  let ticks = 0;
  const total = 14;
  const timer = setInterval(function () {
    dishEl.textContent = pool[Math.floor(Math.random() * pool.length)].name;
    ticks++;
    if (ticks >= total) {
      clearInterval(timer);
      dishEl.textContent = finalDish.name; // 停在最终结果上
      dishEl.classList.remove("rolling");
      pickBtn.disabled = false;
      recBtn.disabled = false;
      onDone(); // 动画结束后，执行回调（保存数据、刷新界面等）
    }
  }, 60);
}

function pick() {
  if (rolling) return;

  const filtered = filterDishes(state.dishes, state.profile);

  // 1. 兜底：如果过滤完没菜了，退回全部菜品（防止点按钮没反应）
  const candidates = filtered.length ? filtered : state.dishes;

  // 2. 原有的去重逻辑（不抽到上次相同的菜）
  const pool = candidates.filter(function (d) { return !state.current || d.name !== state.current.name; });
  const source = pool.length ? pool : candidates;
  if (!source.length) return;

  const chosen = source[Math.floor(Math.random() * source.length)];
  rolling = true;

  // 调用抽出来的动画函数
  playRollAnimation(source, chosen, function () {
    state.current = chosen;
    state.history.unshift(chosen.name);
    state.history = state.history.slice(0, 8);
    save();
    rolling = false;
    renderAll();
  });
}

function addDish() {
  const nameEl = document.getElementById("newName");
  const tagsEl = document.getElementById("newTags");
  const priceEl = document.getElementById("newPrice");
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  if (state.dishes.some(function (d) { return d.name === name; })) {
    alert("已经有这道菜了");
    return;
  }
  const tags = tagsEl.value.split(/[,，\s]+/).filter(Boolean);
  const price = Number(priceEl.value);
  state.dishes.push(upgradeDish({ name: name, tags: tags, price: isFinite(price) && price > 0 ? price : null }));
  nameEl.value = ""; tagsEl.value = ""; priceEl.value = "";
  save();
  renderAll();
  nameEl.focus();
}

function removeDish(name) {
  state.dishes = state.dishes.filter(function (d) { return d.name !== name; });
  if (state.current && state.current.name === name) state.current = null;
  save();
  renderAll();
}


function renderAll() {
  const dishEl = document.getElementById("dish");
  dishEl.textContent = state.current ? state.current.name : "点一下开始";

  const curTags = document.getElementById("curTags");
  const tags = state.current && state.current.tags ? state.current.tags : [];
  const priceText = state.current && state.current.price ? "￥" + state.current.price : "";
  curTags.innerHTML = tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("")
    + (priceText ? '<span class="tag">' + esc(priceText) + "</span>" : "");

  document.getElementById("count").textContent = state.dishes.length;
  renderList();
  renderHistory();
  renderProfile();
}

function renderList() {
  const q = (document.getElementById("filter").value || "").trim().toLowerCase();
  const items = state.dishes.filter(function (d) {
    if (!q) return true;
    const hay = (d.name + " " + (d.tags || []).join(" ")).toLowerCase();
    return hay.indexOf(q) >= 0;
  });

  const list = document.getElementById("list");
  if (!items.length) {
    list.innerHTML = '<div class="empty">' + (q ? "没有匹配的菜品" : "菜单是空的，先添加几道菜") + "</div>";
    return;
  }
  list.innerHTML = items.map(function (d) {
    const price = d.price ? '<span class="price">￥' + d.price + "</span>" : "";
    const tag = (d.tags && d.tags.length) ? '<span class="price">' + esc(d.tags.join(" · ")) + "</span>" : "";
    return '<div class="row">'
      + '<span class="name">' + esc(d.name) + "</span>"
      + tag + price
      + '<button class="del" data-name="' + esc(d.name) + '" title="删除">×</button>'
      + "</div>";
  }).join("");
}

function renderHistory() {
  const hist = document.getElementById("hist");
  if (!state.history.length) {
    hist.innerHTML = '<span style="background:transparent;">还没有记录</span>';
    return;
  }
  hist.innerHTML = state.history.map(function (h) { return "<span>" + esc(h) + "</span>"; }).join("");
}

document.getElementById("pickBtn").addEventListener("click", pick);
document.getElementById("addBtn").addEventListener("click", addDish);
document.getElementById("filter").addEventListener("input", renderList);
document.getElementById("newName").addEventListener("keydown", function (e) {
  if (e.key === "Enter") addDish();
});
document.getElementById("newPrice").addEventListener("keydown", function (e) {
  if (e.key === "Enter") addDish();
});
document.getElementById("list").addEventListener("click", function (e) {
  const btn = e.target.closest(".del");
  if (btn) removeDish(btn.getAttribute("data-name"));
});

// 1. 写入：用户选择后，立刻存进 state.profile 并保存
function bindProfileSelect(id, key, transform) {
  const el = document.getElementById(id);
  el.addEventListener("change", function () {
    const v = el.value;
    state.profile[key] = transform ? transform(v) : v;
    save();
  });
}

// 口味多选：把所有勾选的 checkbox 值收集成数组
document.querySelectorAll(".tasteBox").forEach(function (box) {
  box.addEventListener("change", function () {
    state.profile.taste = [...document.querySelectorAll(".tasteBox:checked")].map(b => b.value);
    save();
  });
});

// 绑定四个下拉框
bindProfileSelect("profileHometown", "hometown");
bindProfileSelect("profileCuisine", "cuisine");
bindProfileSelect("profileGoal", "goals", v => v ? [v] : []); // 目标存成数组
bindProfileSelect("profileMood", "mood");

// 绑定忌口输入框（逗号分隔转数组）
document.getElementById("profileAvoid").addEventListener("input", function (e) {
  state.profile.avoidHard = e.target.value.split(/[,，\s]+/).filter(Boolean);
  save();
});

// 绑定预算输入框（数字转 number 或 null）
document.getElementById("profileBudget").addEventListener("input", function (e) {
  const n = Number(e.target.value);
  state.profile.budget = isFinite(n) && n > 0 ? n : null;
  save();
});

// 2. 回填：加载页面时，把 state.profile 的值填回下拉框
function renderProfile() {
  const p = state.profile;
  document.getElementById("profileHometown").value = p.hometown || "";
  document.getElementById("profileCuisine").value = p.cuisine || "";
  document.getElementById("profileGoal").value = (p.goals && p.goals[0]) || "";
  document.getElementById("profileMood").value = p.mood || "";
  document.getElementById("profileAvoid").value = p.avoidHard ? p.avoidHard.join(",") : "";
  document.getElementById("profileBudget").value = p.budget ?? "";
    // 回填口味多选
  document.querySelectorAll(".tasteBox").forEach(function (box) {
    box.checked = p.taste && p.taste.includes(box.value);
  });
}

async function onRecommend() {
  const recBtn = document.getElementById("recommendBtn");
  const reasonEl = document.getElementById("reason");

  recBtn.disabled = true;
  reasonEl.textContent = "正在为你挑选...";

  // 调用 T4 的推荐引擎（注意这里调用的是 recommend，不带 on）
  const r = await recommend(state.profile, state.dishes, { history: state.history });

  if (!r.dish) {
    reasonEl.textContent = r.reason || "菜单是空的，先添加几道菜";
    recBtn.disabled = false;
    return;
  }

  const animPool = filterDishes(state.dishes, state.profile);
  playRollAnimation(animPool.length ? animPool : state.dishes, r.dish, function () {
    state.current = r.dish;
    state.history.unshift(r.dish.name);
    state.history = state.history.slice(0, 8);
    save();
    renderAll();

    const strategyText = (r.strategy === "explore") ? "【惊喜推荐】" : "【本地推荐】";
    reasonEl.textContent = strategyText + " " + r.reason;
  });
}

// 把按钮和函数绑起来
document.getElementById("recommendBtn").addEventListener("click", onRecommend);

renderAll();
</script>
